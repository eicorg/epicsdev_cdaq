[project]
name = "epicsdev-cdaq"
version = "0.0.1"
description = "EPICS PVAcces server for NI cDAQ"
readme = "README.md"
authors = [
    { name = "Sukhanov, Andrei", email = "sukhanov@bnl.gov" }
]
requires-python = ">=3.11"
dependencies = [
    "epicsdev>=3.3.3",
    "nidaqmx>=1.0",
]

[project.scripts]
epicsdev-cdaq = "epicsdev_cdaq.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
